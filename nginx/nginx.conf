events {
  worker_connections  1024;
}

http {
  server {
    listen 80;
    listen [::]:80;
    server_name ohgetsu.com;

    # Let's Encrypt (HTTP-01) challenge files are served from the shared webroot.
    # This must be reachable over plain HTTP, so it is placed before the redirect.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name ohgetsu.com;

    ssl_certificate /etc/letsencrypt/live/ohgetsu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohgetsu.com/privkey.pem;

    # Modern TLS settings (Let's Encrypt / Mozilla intermediate profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
      proxy_pass http://ohgetsu-web:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    location /api {
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://ohgetsu-server:8080/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      add_header Cache-Control no-cache;
    }
  }
}
