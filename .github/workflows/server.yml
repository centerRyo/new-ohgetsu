name: Server CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    timeout-minutes: 10
    services:
      # prisma/.env.test の接続先 (127.0.0.1:5433/ohgetsu-test) に合わせる
      postgres:
        image: postgres
        env:
          POSTGRES_DB: ohgetsu-test
          POSTGRES_PASSWORD: postgres
          TZ: 'Asia/Tokyo'
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/cache@v3
        id: cache
        env:
          cache-name: cache-node-modules
        with:
          path: '${{ github.workspace }}/server/node_modules'
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        # npm ciだとprisma/clientが生成されない
        # TODO: aws sdkのバージョン不具合のため--legacy-peer-deps オプションをつけている
        run: npm install --legacy-peer-deps

      - name: Type Check
        run: npm run types-check

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Migrate test DB
        run: npx dotenv -e ./prisma/.env.test -- prisma migrate deploy

      - name: Test
        run: npm test
